name: Phase 1.6 CI
on:
  push:
  pull_request:

jobs:
  test-and-container:
    runs-on: ubuntu-latest
    env:
      AUTO_PUBLISH: "false"
      RUN_LIVE_TESTS: "false"
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      BINANCE_SQUARE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m compileall -q src config.py db.py services/binance.py
      - name: Independent import without Telegram/Buffer/API keys
        env:
          DATABASE_URL: sqlite:////tmp/phase1-import.db
          AUTO_PUBLISH: "false"
        run: python -c "from src.app import create_app; create_app(start_workers=False)"
      - run: python -m pytest tests -q
      - name: Compose build and local health smoke (dry run, no collectors)
        run: |
          printf 'COLLECT_ENABLED=false\nADMIN_TOKEN=ci-only-admin-token\nALLOW_UNAUTHENTICATED_ADMIN=false\n' > .env
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8080/health
          docker compose exec -T square-ai python -m src.cli quality-report --json
          docker compose exec -T square-ai python -m src.cli session-report --json
          docker compose exec -T square-ai python -c "import json,subprocess; p=subprocess.run(['python','-m','src.cli','readiness','--json'],capture_output=True,text=True); d=json.loads(p.stdout); assert p.returncode==1 and d['database'] and d['dry_run_lock'] and not d['ready'] and not d['auto_publish']; print('Staging readiness fails closed with no providers/source probes')"
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker compose logs --tail=100
          docker compose down
